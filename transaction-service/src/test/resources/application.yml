spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  cloud:
    discovery:
      enabled: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}

eureka:
  client:
    enabled: false