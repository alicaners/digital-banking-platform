server:
  port: 8082

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/customer_db
    username: ${DB_USERNAME:banking_user}
    password: ${DB_PASSWORD:banking_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
  level:
    org.hibernate.SQL: debug

management:
  server:
    port: 9100
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}