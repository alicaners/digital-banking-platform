services:
  postgres:
    image: postgres:16
    container_name: banking-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-banking_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-banking_pass}
      POSTGRES_DB: banking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-banking_user} -d banking_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - banking-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: banking-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost:2181", "5"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - banking-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: banking-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "cub", "kafka-ready", "1", "5", "-b", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - banking-network

  redis:
    image: redis:7
    container_name: banking-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - banking-network

  eureka-server:
    build:
      context: ./eureka-server
    image: eureka-server:latest
    container_name: banking-eureka-server
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8761' || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - banking-network

  api-gateway:
    build:
      context: ./api-gateway
    image: api-gateway:latest
    container_name: banking-api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_HOST: eureka-server
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - banking-network

  auth-service:
    build:
      context: ./auth-service
    image: auth-service:latest
    container_name: banking-auth-service
    environment:
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-banking_user}
      DB_PASSWORD: ${DB_PASSWORD:-banking_pass}
      EUREKA_HOST: eureka-server
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - banking-network

  customer-service:
    build:
      context: ./customer-service
    image: customer-service:latest
    container_name: banking-customer-service
    environment:
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-banking_user}
      DB_PASSWORD: ${DB_PASSWORD:-banking_pass}
      EUREKA_HOST: eureka-server
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - banking-network

  account-service:
    build:
      context: ./account-service
    image: account-service:latest
    container_name: banking-account-service
    environment:
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-banking_user}
      DB_PASSWORD: ${DB_PASSWORD:-banking_pass}
      REDIS_HOST: redis
      EUREKA_HOST: eureka-server
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - banking-network

  transaction-service:
    build:
      context: ./transaction-service
    image: transaction-service:latest
    container_name: banking-transaction-service
    environment:
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-banking_user}
      DB_PASSWORD: ${DB_PASSWORD:-banking_pass}
      KAFKA_HOST: kafka
      EUREKA_HOST: eureka-server
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - banking-network

  notification-service:
    build:
      context: ./notification-service
    image: notification-service:latest
    container_name: banking-notification-service
    environment:
      KAFKA_HOST: kafka
      EUREKA_HOST: eureka-server
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - banking-network

volumes:
  postgres-data:

networks:
  banking-network:
    driver: bridge